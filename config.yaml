# job-matcher configuration — Raisa Haidar
# Edit as her target roles/locations evolve.

cv:
  path: "cv/Raisa_Haidar_Resume.pdf"

search:
  # Free-text keywords used by boards that support a query param
  # (Remotive, We Work Remotely). Case-insensitive OR match.
  keywords:
    - "quality compliance coordinator"
    - "compliance analyst"
    - "data analyst"
    - "project coordinator"
    - "regulatory affairs coordinator"
    - "quality assurance analyst"

  # A listing's title+description must contain at least one of these
  # (case-insensitive substring match) to survive the cheap first pass.
  must_include_any:
    - "compliance"
    - "quality"
    - "data analy"
    - "project coordinator"
    - "power bi"
    - "regulatory"
    - "customer service"
    - "administrative"

  # Any listing whose title+description contains one of these is dropped
  # immediately, before it ever reaches the embedding model.
  exclude_any:
    - "unpaid"
    - "internship"
    - "no experience"
    - "commission only"
    - "senior director"
    - "vice president"

  # Restrict to postings mentioning these locations/terms
  # (leave empty to allow any location). Substring match, case-insensitive.
  location_include_any:
    - "remote"
    - "austin"
    - "texas"
    - "hybrid"

boards:
  remotive:
    enabled: true
    category: "customer-support"   # see https://remotive.com/api/remote-jobs for category options

  weworkremotely:
    enabled: true
    feeds:
      - "https://weworkremotely.com/categories/remote-customer-support-jobs.rss"
      - "https://weworkremotely.com/categories/remote-management-and-finance-jobs.rss"

  hn_hiring:
    enabled: false   # HN "Who is Hiring" skews heavily software-engineering; low signal for this profile

  greenhouse:
    enabled: true
    # Companies with quality/compliance, regulatory, and data-analyst hiring
    # pipelines on Greenhouse. Add/remove tokens as needed — find them in a
    # company's careers URL: boards.greenhouse.io/<token>
    company_tokens:
      # Pharma / biotech / life sciences — quality, compliance, regulatory roles
      - "pfizer"
      - "iqvia"
      - "veeva"
      - "definitivehc"
      - "blinkhealth"
      - "formationbio"
      - "arspharmaceuticalsoperationsinc"
      - "roivantsciences"
      - "juullabs"
      - "legendcareers"
      - "precisionmedicinegroup"
      - "biofourmis"
      - "pegasuslaboratoriesinc"
      - "acadiapharmaceuticals"
      # Austin, TX–based or Austin-hiring — data analyst / analytics roles
      - "yeti"
      - "zenbusiness"
      - "atlassand"
      - "lightspeedsystems"
      - "striveworks"
      - "whitewatermidstream"
      - "gusto"

matching:
  embedding_model: "all-MiniLM-L6-v2"   # local, ~80MB, CPU-friendly
  min_similarity: 0.30                    # slightly lower floor — her background is cross-functional, so exact wording overlap with postings is lower

llm:
  provider: "ollama_cloud"
  model: "gpt-oss:120b"
  max_candidates: 12
  temperature: 0.2

state:
  db_path: "data/seen_jobs.sqlite3"

output:
  report_path: "report.md"
  open_github_issue: true