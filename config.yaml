# job-matcher configuration
# Edit this file to point at your CV and tune what counts as a match.

cv:
  path: "cv/resume.pdf"          # .pdf, .docx, .txt, or .md

search:
  # Free-text keywords used by boards that support a query param
  # (Remotive, We Work Remotely). Case-insensitive OR match.
  keywords:
    - "applied ai engineer"
    - "machine learning engineer"
    - "ai engineer"
    - "risk engineer"

  # A listing's title+description must contain at least one of these
  # (case-insensitive substring match) to survive the cheap first pass.
  # Leave empty to disable.
  must_include_any:
    - "python"
    - "machine learning"
    - "llm"
    - "ai"

  # Any listing whose title+description contains one of these is dropped
  # immediately, before it ever reaches the embedding model.
  exclude_any:
    - "unpaid"
    - "internship"
    - "no experience"
    - "commission only"

  # Optional: restrict to postings mentioning these locations/terms
  # (leave empty to allow any location). Substring match, case-insensitive.
  location_include_any:
    - "remote"
    - "austin"
    - "texas"

boards:
  remotive:
    enabled: true
    category: "software-dev"    # see https://remotive.com/api/remote-jobs (category param)

  weworkremotely:
    enabled: true
    feeds:
      - "https://weworkremotely.com/categories/remote-programming-jobs.rss"
      - "https://weworkremotely.com/categories/remote-devops-sysadmin-jobs.rss"

  hn_hiring:
    enabled: true
    # HN "Who is Hiring" thread search via Algolia HN Search API
    max_results: 100

  greenhouse:
    enabled: true
    # Any company using Greenhouse's public job board API.
    # Find the token in the company's careers URL:
    # boards.greenhouse.io/<token>
    company_tokens:
      - "stripe"
      - "wise"
      - "adyen"

matching:
  embedding_model: "all-MiniLM-L6-v2"   # local, ~80MB, CPU-friendly
  min_similarity: 0.35                    # 0-1 cosine similarity floor to keep a listing

llm:
  provider: "ollama_cloud"
  model: "gpt-oss:120b"          # any model available on ollama.com/library that supports cloud
  max_candidates: 12               # hard cap on paid LLM calls per run
  temperature: 0.2

state:
  db_path: "data/seen_jobs.sqlite3"

output:
  report_path: "report.md"
  open_github_issue: true       # requires running inside GitHub Actions with issues: write
